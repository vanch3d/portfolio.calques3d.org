<!--
  SVG favicon — raw hex values are intentional here.
  SVG attributes cannot reference CSS custom properties (var(-color-*));
  only presentation attributes and inline style within SVG support CSS, and
  favicons are rendered outside the document's CSS scope. Raw hex is the
  only valid approach. Values: #f8f4ed = -color-ground, #2a2a2a = -color-ink.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" fill="#f8f4ed"/>
  <rect x="0" y="0" width="32" height="32" fill="none" stroke="#2a2a2a" stroke-width="1"/>
  <text
    x="16" y="22"
    font-family="Georgia, serif"
    font-size="14"
    font-style="italic"
    font-weight="400"
    fill="#2a2a2a"
    text-anchor="middle"
    letter-spacing="-0.5"
  >NVL</text>
</svg>
