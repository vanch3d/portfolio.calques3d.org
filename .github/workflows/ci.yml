name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs on the same branch when a new push arrives.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10.26.1"

jobs:
  # ── 1. validate ───────────────────────────────────────────────────────────
  # Content schema validation, Mermaid syntax check, TypeScript type check.
  # No secrets needed — runs on PRs and pushes alike.
  validate:
    name: Validate (schemas + types)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Content schemas + Mermaid diagrams
        run: pnpm validate

      - name: TypeScript type check
        run: pnpm exec tsc --noEmit

  # ── 2. test-unit ──────────────────────────────────────────────────────────
  # Vitest unit tests with MSW node server.
  # Runs in a pure Node environment — no browser, no secrets.
  test-unit:
    name: Unit tests (Vitest + MSW)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

  # ── 3. test-component ─────────────────────────────────────────────────────
  # Cypress Component Testing — mounts components in an iframe, runs axe checks.
  # No Next.js server needed: Cypress CT bundles each component via webpack.
  test-component:
    name: Component tests (Cypress CT + axe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # cypress-io/github-action@v6 supports pnpm via package-manager option.
      - uses: cypress-io/github-action@v6
        with:
          component: true
          package-manager: pnpm

  # ── 4. test-e2e ───────────────────────────────────────────────────────────
  # Cypress E2E smoke tests against a local production build.
  # Requires ZOTERO_* secrets for ISR routes (Zotero API calls during build).
  # Strategy: pnpm install → build (secrets) → cypress-action starts the server.
  test-e2e:
    name: E2E smoke tests (Cypress + axe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build Next.js (production)
        run: pnpm build
        env:
          ZOTERO_USER_ID: ${{ secrets.ZOTERO_USER_ID }}
          ZOTERO_API_KEY: ${{ secrets.ZOTERO_API_KEY }}
          ZOTERO_COLLECTION_ID: ${{ secrets.ZOTERO_COLLECTION_ID }}

      # install:false — pnpm install already done above.
      # Action starts `pnpm start` then waits for localhost:3000.
      - name: Run Cypress E2E
        uses: cypress-io/github-action@v6
        with:
          install: false
          start: pnpm start
          wait-on: "http://localhost:3000"
          wait-on-timeout: 60
        env:
          ZOTERO_USER_ID: ${{ secrets.ZOTERO_USER_ID }}
          ZOTERO_API_KEY: ${{ secrets.ZOTERO_API_KEY }}
          ZOTERO_COLLECTION_ID: ${{ secrets.ZOTERO_COLLECTION_ID }}

  # ── 5. deploy-staging ─────────────────────────────────────────────────────
  # Deploys to a Vercel PREVIEW environment after all tests pass on main.
  # Uses `vercel deploy` (no --prod) to get a staging URL without touching
  # production. Skipped on pull_request — Vercel's GitHub integration handles
  # PR previews automatically.
  deploy-staging:
    name: Deploy to Vercel (staging/preview)
    needs: [validate, test-unit, test-component, test-e2e]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm add -g vercel@latest

      # Pull production env vars so the staging build is identical to prod.
      - name: Pull Vercel environment (production vars)
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # Build with production env vars — no --prod flag (preview deploy).
      - name: Build (Vercel)
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # Deploy prebuilt output as a preview (no --prod). Capture the staging URL.
      - name: Deploy prebuilt to preview
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  # ── 6. test-playwright ────────────────────────────────────────────────────
  # Playwright full E2E + axe-core accessibility tests against the staging URL.
  # The deployment is a preview (not yet production) — if Playwright fails,
  # production is never touched.
  test-playwright:
    name: Full E2E + a11y (Playwright vs staging)
    needs: [deploy-staging]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Install only Chromium — playwright.config.ts targets chromium only.
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright tests (against staging)
        run: pnpm test:playwright
        env:
          PLAYWRIGHT_BASE_URL: ${{ needs.deploy-staging.outputs.url }}

  # ── 7. promote-production ─────────────────────────────────────────────────
  # Promotes the already-deployed staging URL to production.
  # `vercel promote` does NOT rebuild — it atomically aliases the tested preview
  # deployment to the production domain. No new build risk at this step.
  # Only runs after Playwright passes.
  promote-production:
    name: Promote staging → production
    needs: [deploy-staging, test-playwright]
    runs-on: ubuntu-latest
    steps:
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - run: pnpm add -g vercel@latest

      - name: Promote to production
        run: vercel promote ${{ needs.deploy-staging.outputs.url }} --token=${{ secrets.VERCEL_TOKEN }} --yes
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
