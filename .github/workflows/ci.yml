name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs on the same branch when a new push arrives.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10.26.1"

jobs:
  # ── 1. validate ───────────────────────────────────────────────────────────
  # Content schema validation, Mermaid syntax check, TypeScript type check.
  # No secrets needed — runs on PRs and pushes alike.
  validate:
    name: Validate (schemas + types)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Content schemas + Mermaid diagrams
        run: pnpm validate

      - name: TypeScript type check
        run: pnpm exec tsc --noEmit

  # ── 2. test-unit ──────────────────────────────────────────────────────────
  # Vitest unit tests with MSW node server.
  # Runs in a pure Node environment — no browser, no secrets.
  test-unit:
    name: Unit tests (Vitest + MSW)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

  # ── 3. test-component ─────────────────────────────────────────────────────
  # Cypress Component Testing — mounts components in an iframe, runs axe checks.
  # No Next.js server needed: Cypress CT bundles each component via webpack.
  #
  # install: false — we manage pnpm install ourselves so that onlyBuiltDependencies
  # is respected and the Cypress binary is downloaded via an explicit step.
  # (cypress-io/github-action internal pnpm install ignores the package.json
  # pnpm config, leaving the binary missing.)
  test-component:
    name: Component tests (Cypress CT + axe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Cypress binary
        run: pnpm exec cypress install

      - uses: cypress-io/github-action@v6
        with:
          component: true
          install: false

  # ── 4. test-e2e ───────────────────────────────────────────────────────────
  # Cypress E2E smoke tests against a local production build.
  # Requires ZOTERO_* secrets for ISR routes (Zotero API calls during build).
  # Strategy: pnpm install → build (secrets) → cypress-action starts the server.
  test-e2e:
    name: E2E smoke tests (Cypress + axe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Cypress binary
        run: pnpm exec cypress install

      - name: Build Next.js (production)
        run: pnpm build
        env:
          ZOTERO_USER_ID: ${{ secrets.ZOTERO_USER_ID }}
          ZOTERO_API_KEY: ${{ secrets.ZOTERO_API_KEY }}
          ZOTERO_COLLECTION_ID: ${{ secrets.ZOTERO_COLLECTION_ID }}

      # install:false — pnpm install already done above.
      # Action starts `pnpm start` then waits for localhost:3000.
      - name: Run Cypress E2E
        uses: cypress-io/github-action@v6
        with:
          install: false
          start: pnpm start
          wait-on: "http://localhost:3000"
          wait-on-timeout: 60
        env:
          ZOTERO_USER_ID: ${{ secrets.ZOTERO_USER_ID }}
          ZOTERO_API_KEY: ${{ secrets.ZOTERO_API_KEY }}
          ZOTERO_COLLECTION_ID: ${{ secrets.ZOTERO_COLLECTION_ID }}

  # ── 5. deploy-staging ─────────────────────────────────────────────────────
  # Deploys to a Vercel PREVIEW environment after all tests pass on main.
  # Uses `vercel deploy` (no --prod) to get a staging URL without touching
  # production. Skipped on pull_request — Vercel's GitHub App handles PR
  # previews automatically and independently of this workflow.
  deploy-staging:
    name: Deploy to Vercel (staging — main only)
    needs: [validate, test-unit, test-component, test-e2e]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm add -g vercel@latest

      # Pull preview env vars — must match the build target (no --prod = preview).
      - name: Pull Vercel environment (preview vars)
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # Build for preview. Forward ZOTERO_* secrets directly as a safety net
      # in case they are not yet propagated in the pulled Vercel env file.
      - name: Build (Vercel)
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          ZOTERO_USER_ID: ${{ secrets.ZOTERO_USER_ID }}
          ZOTERO_API_KEY: ${{ secrets.ZOTERO_API_KEY }}
          ZOTERO_COLLECTION_ID: ${{ secrets.ZOTERO_COLLECTION_ID }}

      # Deploy prebuilt output as a preview (no --prod). Capture the staging URL.
      - name: Deploy prebuilt to preview
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  # ── 6a. test-playwright ───────────────────────────────────────────────────
  # Playwright full E2E + axe-core accessibility tests against the staging URL.
  # Only runs on push to main (after deploy-staging). PRs use test-playwright-pr.
  test-playwright:
    name: Full E2E + a11y (Playwright vs staging)
    needs: [deploy-staging]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Install only Chromium — playwright.config.ts targets chromium only.
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright tests (against staging)
        run: pnpm test:playwright
        env:
          PLAYWRIGHT_BASE_URL: ${{ needs.deploy-staging.outputs.url }}

  # ── 6b. test-playwright-pr ────────────────────────────────────────────────
  # Playwright full E2E + a11y tests against the Vercel preview URL for PRs.
  # Vercel's GitHub App auto-deploys every PR branch. This job polls the GitHub
  # Deployments API to resolve the preview URL, then runs Playwright against it.
  # Runs after all tests pass — skipped on push to main (test-playwright handles that).
  test-playwright-pr:
    name: Full E2E + a11y (Playwright vs PR preview)
    needs: [validate, test-unit, test-component, test-e2e]
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      deployments: read
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      # Poll the GitHub Deployments API until Vercel's GitHub App marks the
      # preview deployment as successful and exposes its environment_url.
      # Timeout: 15 × 20 s = 5 minutes.
      - name: Resolve Vercel preview URL
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA="${{ github.event.pull_request.head.sha }}"
          REPO="${{ github.repository }}"
          for i in $(seq 1 15); do
            DEPLOYMENT_ID=$(gh api "repos/$REPO/deployments" \
              --jq "[.[] | select(.sha == \"$SHA\" and (.environment | ascii_downcase | startswith(\"preview\")))] | .[0].id // empty")
            if [ -n "$DEPLOYMENT_ID" ] && [ "$DEPLOYMENT_ID" != "null" ]; then
              URL=$(gh api "repos/$REPO/deployments/$DEPLOYMENT_ID/statuses" \
                --jq '[.[] | select(.state == "success")] | .[0].environment_url // empty')
              if [ -n "$URL" ] && [ "$URL" != "null" ]; then
                echo "url=$URL" >> "$GITHUB_OUTPUT"
                echo "Resolved: $URL"
                exit 0
              fi
            fi
            echo "Attempt $i/15: not ready, waiting 20s..."
            sleep 20
          done
          echo "::error::Could not resolve Vercel preview URL after 5 minutes"
          exit 1

      - name: Run Playwright tests (against PR preview)
        run: pnpm test:playwright
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.resolve.outputs.url }}

  # ── 7. promote-production ─────────────────────────────────────────────────
  # Promotes the already-deployed staging URL to production.
  # `vercel promote` does NOT rebuild — it atomically aliases the tested preview
  # deployment to the production domain. No new build risk at this step.
  # Only runs after Playwright passes on main.
  promote-production:
    name: Promote staging → production
    needs: [deploy-staging, test-playwright]
    runs-on: ubuntu-latest
    steps:
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - run: pnpm add -g vercel@latest

      - name: Promote to production
        run: vercel promote ${{ needs.deploy-staging.outputs.url }} --token=${{ secrets.VERCEL_TOKEN }} --yes
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
