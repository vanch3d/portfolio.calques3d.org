<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Component Test</title>
    <style>
      /*
       * next/font injects --font-geist-sans/mono via className on <html> at
       * runtime. In CT there is no Next.js server, so we set them here as a
       * best-effort approximation. The globals.css stubs cover IDE analysis;
       * these rules cover the actual CT browser session.
       */
      :root {
        --font-geist-sans: "Geist", system-ui, sans-serif;
        --font-geist-mono: "Geist Mono", ui-monospace, monospace;
      }

      /*
       * Visually hidden utility — used to satisfy page-level axe rules
       * (landmark-one-main, page-has-heading-one, region) that are
       * not meaningful in a component-isolation testing context.
       * The <main> and <h1> below are structural scaffolding only.
       */
      /*
       * Animation freeze for accessibility testing (ADR 011).
       * animation-fill-mode: both causes elements to start at their `from`
       * keyframe (e.g. opacity: 0) at first paint. axe runs synchronously
       * after mount and would see near-zero opacity, triggering false
       * colour-contrast violations. Collapsing durations to 0.001ms ensures
       * every animation completes within one frame — axe always sees the
       * final resting state. The animation infrastructure remains intact.
       */
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-delay: 0ms !important;
      }

      .cy-a11y-scaffold {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
    </style>
  </head>
  <body>
    <!--
      Structural scaffold to satisfy page-level axe rules that do not apply
      to individual components:
        - landmark-one-main  → provided by <main>
        - page-has-heading-one → provided by the visually hidden <h1>
        - region → all content is inside the <main> landmark

      If a component under test itself renders a <main> or <h1>, the
      corresponding axe rule should be disabled in that spec via cy.configureAxe().
    -->
    <!--
      Required anchor for next-style-loader. Without this div, the loader's
      insert function calls parentNode on a null querySelector result and throws
      before any CSS loads.
      Ref: https://docs.cypress.io/app/component-testing/styling-components#Importing-Global-Styles
    -->
    <div id="__next_css__DO_NOT_USE__"></div>

    <main id="cy-component-root">
      <h1 class="cy-a11y-scaffold">Component Test</h1>
      <div data-cy-root></div>
    </main>
  </body>
</html>
