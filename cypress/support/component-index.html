<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Component Test</title>
    <style>
      /*
       * next/font injects --font-geist-sans/mono via className on <html> at
       * runtime. In CT there is no Next.js server, so we set them here as a
       * best-effort approximation. The globals.css stubs cover IDE analysis;
       * these rules cover the actual CT browser session.
       */
      :root {
        --font-geist-sans: "Geist", system-ui, sans-serif;
        --font-geist-mono: "Geist Mono", ui-monospace, monospace;
      }

      /*
       * Visually hidden utility — used to satisfy page-level axe rules
       * (landmark-one-main, page-has-heading-one, region) that are
       * not meaningful in a component-isolation testing context.
       * The <main> and <h1> below are structural scaffolding only.
       */
      .cy-a11y-scaffold {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
    </style>
  </head>
  <body>
    <!--
      Structural scaffold to satisfy page-level axe rules that do not apply
      to individual components:
        - landmark-one-main  → provided by <main>
        - page-has-heading-one → provided by the visually hidden <h1>
        - region → all content is inside the <main> landmark

      If a component under test itself renders a <main> or <h1>, the
      corresponding axe rule should be disabled in that spec via cy.configureAxe().
    -->
    <main id="cy-component-root">
      <h1 class="cy-a11y-scaffold">Component Test</h1>
      <div data-cy-root></div>
    </main>
  </body>
</html>
