<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Component Test</title>
    <!--
      next-style-loader (used by Next.js for CSS in development) requires an
      anchor element with id="__next_css__DO_NOT_USE__" in the document before
      it can inject <style> tags. Without it, it throws a null-reference error
      and CSS never loads. The div below satisfies that requirement.

      See: https://docs.cypress.io/app/component-testing/styling-components#Importing-Global-Styles
    -->
    <style>
      /*
       * Visually hidden utility — satisfies page-level axe rules
       * (landmark-one-main, page-has-heading-one, region) that don't
       * apply in component-isolation testing context.
       */
      .cy-a11y-scaffold {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
    </style>
  </head>
  <body>
    <!-- Anchor required by next-style-loader to inject CSS <style> tags. -->
    <div id="__next_css__DO_NOT_USE__"></div>
    <!--
      Structural scaffold to satisfy page-level axe rules that do not apply
      to individual components:
        - landmark-one-main  → provided by <main>
        - page-has-heading-one → provided by the visually hidden <h1>
        - region → all content is inside the <main> landmark

      If a component under test itself renders a <main> or <h1>, the
      corresponding axe rule should be disabled in that spec via cy.configureAxe().
    -->
    <main id="cy-component-root">
      <h1 class="cy-a11y-scaffold">Component Test</h1>
      <div data-cy-root></div>
    </main>
  </body>
</html>
